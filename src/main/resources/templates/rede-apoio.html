<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Rede de Apoio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
          background-color: #EDE9F3; /* Lilás claro */
            margin: 0;
            min-height: 100vh;
            color: #232023;
        }

        /* Barra de navegação */
        .topbar {
            width: 100%;
            background: #fafafa;
            border-bottom: 1.2px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 12px;
            font-size: 1em;
            color: #232023;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .topbar-link:hover {
            color: #dc3545;
        }
        .topbar-link i {
            font-size: 24px;
            color: #dc3545;
        }
        .topbar-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.2);
        }
        .topbar-icon i {
            font-size: 20px;
            color: white;
        }

        /* Container centralizado */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Header com logo */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffe5e5 0%, #ffd5d5 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(220, 53, 69, 0.15);
        }
        .header-logo i {
            font-size: 40px;
            color: #dc3545;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 1rem;
            color: #666;
            line-height: 1.5;
        }

        /* Tabela moderna */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(220, 53, 69, 0.12);
            margin-top: 20px;
        }
        th, td {
            padding: 16px 20px;
            text-align: left;
            transition: background 0.2s ease;
        }
        th {
            background: #dc3545;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }
        tr:nth-child(even) {
            background: #f7f6fb;
        }
        tr:nth-child(odd) {
            background: white;
        }
        tr:hover {
            background: #ffe5e8;
            cursor: pointer;
        }

         /* ======== RESPONSIVO ======== */
        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 25px;
            }
            .topbar {
                padding: 0 16px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .header-logo {
                width: 60px;
                height: 60px;
            }
            .header-logo i {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">
        <a th:href="@{/usuarios/home}" class="topbar-link">
            <i class="bi bi-arrow-left-circle"></i>
            <span>Rede de Apoio</span>
        </a>
    </div>
    <div class="topbar-icon">
        <i class="bi bi-geo-alt-fill"></i>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="header-logo">
            <i class="bi bi-geo-alt-fill"></i>
        </div>
        <h1>Rede de Apoio</h1>
        <p>Veja abaixo as ONGs e instituições cadastradas que ajudam no combate à violência doméstica.</p>
    </div>

    <table>
        <thead>
        <tr>
            <th>Nome da ONG</th>
            <th>Contato</th>
            <th>Rua</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${ongs}">
            <td th:text="${item.nomeDaOng}"></td>
            <td th:text="${item.contatoDaOng}"></td>
            <td th:text="${item.rua}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
