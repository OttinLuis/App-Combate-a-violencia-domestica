<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denunciar Caso</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background-color: #ede9f3;
            min-height: 100vh;
        }

        .topbar {
            width: 100%;
            background: #fafafa;
            border-bottom: 1px solid #ececec;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 30px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-left a {
            text-decoration: none;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
        }

        .topbar-left i {
            color: #ef533f;
            font-size: 26px;
        }

        .topbar-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff6f61, #ef533f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 20px 40px;
        }

        .hero {
            text-align: center;
            margin-bottom: 28px;
        }

        .hero-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 18px;
            border-radius: 24px;
            background: #f8dedd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-icon i {
            color: #ef533f;
            font-size: 42px;
        }

        .hero h1 {
            font-size: 3rem;
            color: #171717;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .hero p {
            color: #666;
            font-size: 1.1rem;
        }

        .main-card {
            background: #fff;
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 5px solid #ef533f;
        }

        .section {
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 800;
            color: #ef533f;
            margin-bottom: 14px;
        }

        .section-title i {
            font-size: 20px;
        }

        .info-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #252525;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #fafafa;
            font-size: 15px;
            margin-bottom: 10px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #ef533f;
            background: #fff;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: -4px;
            margin-bottom: 10px;
        }

        .erro {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 700;
            margin-top: -3px;
            margin-bottom: 10px;
        }

        .input-error {
            border: 1px solid #e74c3c !important;
            background: #fff5f5 !important;
        }

        .photo-upload-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 10px;
        }

        .photo-upload-wrapper {
            position: relative;
        }

        .photo-upload {
            width: 100%;
            aspect-ratio: 1;
            background: #fafafa;
            border: 2px dashed #d9d9d9;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: 0.2s;
        }

        .photo-upload:hover {
            border-color: #ef533f;
            background: #fff8f7;
        }

        .photo-upload i {
            font-size: 28px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }

        .photo-upload span {
            font-size: 13px;
            color: #666;
            font-weight: 700;
        }

        .photo-upload input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .photo-preview {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: none;
            border-radius: 14px;
        }

        .remove-photo {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: #ef533f;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
        }

        .photo-count {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        .input-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ef533f, #e04533);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .photo-upload-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .input-row,
            .input-row-2 {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 12px 16px;
            }

            .container {
                padding: 0 14px 30px;
            }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <a th:href="@{/usuarios/home}">
            <i class="bi bi-arrow-left-circle"></i>
            <span>Denunciar Caso</span>
        </a>
    </div>

    <div class="topbar-icon">
        <i class="bi bi-journal-text"></i>
    </div>
</div>

<div class="container">

    <div class="hero">
        <div class="hero-icon">
            <i class="bi bi-journal-text"></i>
        </div>
        <h1>Denunciar Caso</h1>
        <p>Registre o incidente de forma segura e anônima.</p>
    </div>

    <div class="main-card">
        <form th:action="@{/denuncia/salvar}"
              method="post"
              th:object="${denuncia}"
              enctype="multipart/form-data">

            <!-- EVIDÊNCIAS -->
            <div class="section">
                <div class="section-title">
                    <i class="bi bi-camera"></i>
                    <span>Evidências (opcional)</span>
                </div>

                <div class="photo-upload-container">
                    <div class="photo-upload-wrapper">
                        <div class="photo-upload" id="photoUpload1">
                            <i class="bi bi-camera"></i>
                            <span>Foto 1</span>
                            <input type="file" id="photoInput1" name="foto1" accept="image/*" onchange="previewPhoto(event, 1)">
                        </div>
                        <img id="photoPreview1" class="photo-preview" alt="Preview 1">
                        <button type="button" class="remove-photo" id="removeBtn1" onclick="removePhoto(1)">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>

                    <div class="photo-upload-wrapper">
                        <div class="photo-upload" id="photoUpload2">
                            <i class="bi bi-camera"></i>
                            <span>Foto 2</span>
                            <input type="file" id="photoInput2" name="foto2" accept="image/*" onchange="previewPhoto(event, 2)">
                        </div>
                        <img id="photoPreview2" class="photo-preview" alt="Preview 2">
                        <button type="button" class="remove-photo" id="removeBtn2" onclick="removePhoto(2)">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>

                    <div class="photo-upload-wrapper">
                        <div class="photo-upload" id="photoUpload3">
                            <i class="bi bi-camera"></i>
                            <span>Foto 3</span>
                            <input type="file" id="photoInput3" name="foto3" accept="image/*" onchange="previewPhoto(event, 3)">
                        </div>
                        <img id="photoPreview3" class="photo-preview" alt="Preview 3">
                        <button type="button" class="remove-photo" id="removeBtn3" onclick="removePhoto(3)">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </div>

                <div class="photo-count" id="photoCount">0 foto(s) adicionada(s)</div>
            </div>

            <!-- RELATO -->
            <div class="section">
                <div class="section-title">
                    <i class="bi bi-pencil-square"></i>
                    <span>Relato</span>
                </div>

                <label class="info-label" for="relato">Descreva o ocorrido:</label>
                <textarea id="relato"
                          th:field="*{relato}"
                          placeholder="Descreva detalhadamente o que aconteceu..."
                          required
                          minlength="20"
                          th:classappend="${#fields.hasErrors('relato')} ? 'input-error'"></textarea>

                <div class="hint">Mínimo de 20 caracteres.</div>

                <div class="erro"
                     th:if="${#fields.hasErrors('relato')}"
                     th:errors="*{relato}"></div>
            </div>

            <!-- CEP -->
            <div class="section">
                <div class="section-title">
                    <i class="bi bi-geo-alt"></i>
                    <span>CEP</span>
                </div>

                <label class="info-label" for="cep">Digite o CEP:</label>
                <input type="text"
                       id="cep"
                       th:field="*{cep}"
                       placeholder="00000-000"
                       required
                       th:classappend="${#fields.hasErrors('cep')} ? 'input-error'">

                <div class="erro"
                     th:if="${#fields.hasErrors('cep')}"
                     th:errors="*{cep}"></div>
            </div>

            <!-- ENDEREÇO -->
            <div class="section">
                <div class="section-title">
                    <i class="bi bi-house-door"></i>
                    <span>Endereço do incidente</span>
                </div>

                <div class="input-row">
                    <div>
                        <label class="info-label" for="rua">Rua</label>
                        <input type="text"
                               id="rua"
                               th:field="*{rua}"
                               placeholder="Rua"
                               required
                               th:classappend="${#fields.hasErrors('rua')} ? 'input-error'">

                        <div class="erro"
                             th:if="${#fields.hasErrors('rua')}"
                             th:errors="*{rua}"></div>
                    </div>

                    <div>
                        <label class="info-label" for="numero">Número</label>
                        <input type="text"
                               id="numero"
                               th:field="*{numero}"
                               placeholder="Nº">
                    </div>
                </div>

                <label class="info-label" for="bairro">Bairro</label>
                <input type="text"
                       id="bairro"
                       th:field="*{bairro}"
                       placeholder="Bairro"
                       required
                       th:classappend="${#fields.hasErrors('bairro')} ? 'input-error'">

                <div class="erro"
                     th:if="${#fields.hasErrors('bairro')}"
                     th:errors="*{bairro}"></div>

                <div class="input-row-2">
                    <div>
                        <label class="info-label" for="cidade">Cidade</label>
                        <input type="text"
                               id="cidade"
                               th:field="*{municipio}"
                               placeholder="Cidade">
                    </div>

                    <div>
                        <label class="info-label" for="estado">Estado</label>
                        <input type="text"
                               id="estado"
                               th:field="*{estado}"
                               placeholder="Estado">
                    </div>
                </div>
            </div>

            <!-- BOTÃO -->
            <div class="section">
                <button class="submit-btn" type="submit">
                    <i class="bi bi-send"></i>
                    Enviar denúncia
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function updatePhotoCount() {
        let count = 0;
        for (let i = 1; i <= 3; i++) {
            const input = document.getElementById(`photoInput${i}`);
            if (input && input.files.length > 0) {
                count++;
            }
        }
        document.getElementById("photoCount").textContent = `${count} foto(s) adicionada(s)`;
    }

    function previewPhoto(event, index) {
        const file = event.target.files[0];
        if (!file) return;

        const preview = document.getElementById(`photoPreview${index}`);
        const upload = document.getElementById(`photoUpload${index}`);
        const removeBtn = document.getElementById(`removeBtn${index}`);

        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = "block";
            upload.style.display = "none";
            removeBtn.style.display = "flex";
            updatePhotoCount();
        };
        reader.readAsDataURL(file);
    }

    function removePhoto(index) {
        const preview = document.getElementById(`photoPreview${index}`);
        const upload = document.getElementById(`photoUpload${index}`);
        const input = document.getElementById(`photoInput${index}`);
        const removeBtn = document.getElementById(`removeBtn${index}`);

        preview.src = "";
        preview.style.display = "none";
        upload.style.display = "flex";
        removeBtn.style.display = "none";
        input.value = "";

        updatePhotoCount();
    }

    const cepInput = document.getElementById("cep");

    if (cepInput) {
        cepInput.addEventListener("input", () => {
            cepInput.value = cepInput.value
                .replace(/\D/g, "")
                .replace(/(\d{5})(\d)/, "$1-$2")
                .substring(0, 9);
        });

        cepInput.addEventListener("blur", () => {
            const cep = cepInput.value.replace(/\D/g, "");

            if (cep.length !== 8) return;

            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(res => res.json())
                .then(data => {
                    if (data.erro) {
                        alert("CEP não encontrado.");
                        return;
                    }

                    document.getElementById("rua").value = data.logradouro || "";
                    document.getElementById("bairro").value = data.bairro || "";
                    document.getElementById("cidade").value = data.localidade || "";
                    document.getElementById("estado").value = data.uf || "";
                })
                .catch(() => {
                    alert("Erro ao buscar o CEP.");
                });
        });
    }

    updatePhotoCount();
</script>

</body>
</html>
