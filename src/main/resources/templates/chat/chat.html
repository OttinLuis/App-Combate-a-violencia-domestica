<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assistente - Mãos Amigas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #EDE9F3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* HEADER */
        .chat-header {
            background: linear-gradient(135deg, #5D4E8E, #A153D2);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .chat-header span {
            font-size: 13px;
            opacity: 0.9;
        }

        .btn-voltar {
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 16px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: rgba(255,255,255,0.35);
        }

        /* MENSAGENS */
        .chat-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #F7F4FB;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeMsg 0.3s ease;
        }

        @keyframes fadeMsg {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6C5AAE, #5D4E8E);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot {
            align-self: flex-start;
            background: white;
            border: 1px solid #E5DDF7;
            color: #333;
            border-bottom-left-radius: 6px;
        }

        .welcome {
            background: #EFE8FB;
            border: 1px solid #DDD2F4;
            color: #4B3E78;
        }

        /* INPUT */
        .chat-footer {
            padding: 18px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #EEE;
            background: white;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #D6CCF0;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #6C5AAE;
            box-shadow: 0 0 0 2px rgba(108,90,174,0.15);
        }

        button {
            background: linear-gradient(135deg, #6C5AAE, #5D4E8E);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(93, 78, 142, 0.25);
        }

        @media(max-width: 600px) {
            .msg {
                max-width: 90%;
            }

            .chat-container {
                height: 95vh;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- HEADER -->
    <div class="chat-header">
        <div>
            <h2>Assistente de Acolhimento</h2>
            <span>Estou aqui para te ajudar 💜</span>
        </div>

        <a th:href="@{/usuarios/home}" class="btn-voltar">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <!-- CHAT -->
    <div id="mensagens" class="chat-body">
        <div class="msg bot welcome">
            Olá! Posso te ajudar com:
            <br><br>
            • Denúncia
            • Suporte psicológico
            • Cadastro ou login
            <br><br>
            Me diga o que você precisa.
        </div>
    </div>

    <!-- INPUT -->
    <div class="chat-footer">
        <input id="input" type="text" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">Enviar</button>
    </div>

</div>

<script>
    function enviar() {
        let input = document.getElementById("input");
        let texto = input.value.trim();

        if (!texto) return;

        adicionarMensagem(texto, "user");
        input.value = "";

        fetch("/agente", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({mensagem: texto})
        })
        .then(res => res.json())
        .then(data => {
            adicionarMensagem(data.resposta, "bot");

            if (data.rota) {
                setTimeout(() => {
                    window.location.href = data.rota;
                }, 1800);
            }
        })
        .catch(() => {
            adicionarMensagem("Erro ao conectar com o assistente.", "bot");
        });
    }

    function adicionarMensagem(texto, tipo) {
        let div = document.createElement("div");
        div.classList.add("msg", tipo);
        div.innerText = texto;

        document.getElementById("mensagens").appendChild(div);
        document.getElementById("mensagens").scrollTop = 9999;
    }
</script>

</body>
</html>
