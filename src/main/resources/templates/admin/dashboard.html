<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Mãos Amigas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background-color: #EDE9F3;
            color: #222;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* BOTÃO VOLTAR (estilo do seu sistema) */
        .top-actions {
            margin-bottom: 20px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #e74c3c 0%, #ff6b6b 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s ease;
            box-shadow: 0 4px 14px rgba(107, 93, 164, 0.3);
        }

        .btn-voltar:hover {
            background-color: red;
            transform: translateY(-2px);
        }

        .topo {
            margin-bottom: 28px;
        }

        .topo h1 {
            font-size: 2.4rem;
            color: #1f1f1f;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .topo p {
            font-size: 1.05rem;
            color: #444;
            line-height: 1.6;
            max-width: 700px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.07);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 2rem;
            color: #222;
            margin-bottom: 20px;
        }

        .estatistica-item {
            margin-bottom: 18px;
        }

        .estatistica-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .barra {
            width: 260px;
            max-width: 100%;
            height: 14px;
            background-color: #d9d6d6;
            border-radius: 999px;
            overflow: hidden;
        }

        .preenchimento {
            height: 100%;
            border-radius: 999px;
            background-color: #4d5456;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .numero-destaque {
            font-size: 3rem;
            font-weight: 600;
            margin: 8px 0;
        }

        .lista-profissionais {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .linha-profissional {
            display: flex;
            justify-content: space-between;
        }

        .resumo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .mini-card {
            background-color: #faf7fb;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
        }

        .mini-card h3 {
            color: #5D4E8E;
        }

        .mini-card p {
            font-size: 2rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .grid,
            .resumo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- BOTÃO VOLTAR -->
    <div class="top-actions">
        <a th:href="@{/usuarios/home}" class="btn-voltar">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </div>

    <div class="topo">
        <h1>Painel administrativo</h1>
        <p>
            Visão geral do sistema de combate à violência doméstica,
            com dados reais do sistema.
        </p>
    </div>

    <!-- Estatísticas -->
    <section class="card">
        <h2>Estatísticas</h2>

        <div class="estatistica-item">
            <span>Uso do sistema</span>
            <div class="barra">
                <div class="preenchimento"
                     th:style="'width:' + ${porcentagemUsoSistema} + '%'"></div>
            </div>
        </div>

        <div class="estatistica-item">
            <span>Denúncias</span>
            <div class="barra">
                <div class="preenchimento"
                     th:style="'width:' + ${porcentagemDenuncias} + '%'"></div>
            </div>
        </div>
    </section>

    <!-- Grid principal -->
    <section class="grid">
        <div class="card">
            <h2>Usuários</h2>
            <div class="numero-destaque" th:text="${totalUsuarios}">0</div>
        </div>

        <div class="card">
            <h2>Rede de apoio</h2>

            <div class="lista-profissionais">
                <div class="linha-profissional">
                    <strong>Psicólogas</strong>
                    <span th:text="${totalPsicologas}"></span>
                </div>

                <div class="linha-profissional">
                    <strong>ONGs</strong>
                    <span th:text="${totalOngs}"></span>
                </div>

                <div class="linha-profissional">
                    <strong>Total</strong>
                    <span th:text="${totalSuportes}"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Resumo -->
    <section class="card">
        <h2>Resumo</h2>

        <div class="resumo-grid">
            <div class="mini-card">
                <h3>Usuários</h3>
                <p th:text="${totalUsuarios}"></p>
            </div>

            <div class="mini-card">
                <h3>Denúncias</h3>
                <p th:text="${totalDenuncias}"></p>
            </div>

            <div class="mini-card">
                <h3>Suportes</h3>
                <p th:text="${totalSuportes}"></p>
            </div>
        </div>
    </section>

</div>

</body>
</html>
