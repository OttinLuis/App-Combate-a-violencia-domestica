<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mãos Amigas - Home</title>

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #EDE9F3; /* Lilás claro */
            margin: 0;
            padding: 0;
        }

        .logout-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background-color: #d9534f;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            background-color: #c9302c;
            transform: scale(1.05);
        }

        .logo-container {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .logo-container img {
            max-width: 250px;
            height: auto;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            padding: 20px 20px 30px;
            color: #4B3E7C;
        }

        .header h1 {
            font-size: 2.3rem;
            font-weight: 700;
            margin: 0;
        }

        .header p {
            color: #5C5C5C;
            font-size: 15px;
            margin-top: 10px;
        }

        .date {
            margin-top: 10px;
            color: #8F8F8F;
            font-size: 14px;
        }

        .alert-box {
            background-color: #FEECEC;
            border: 1px solid #F5B5B5;
            color: #7A0000;
            border-radius: 10px;
            padding: 15px 20px;
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 10px rgba(255,0,0,0.05);
        }

        .alert-box button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .alert-box button:hover {
            background-color: #c0392b;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px auto;
            width: 90%;
            max-width: 900px;
        }

        .card {
            flex: 1 1 180px;
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .card i {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 10px 0 5px;
            font-size: 17px;
            color: #4B3E7C;
        }

        .card p {
            font-size: 13px;
            color: #5E5E5E;
        }

        .red { color: #E74C3C; }
        .purple { color: #A153D2; }
        .blue { color: #3498db; }
        .green { color: #27ae60; }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            font-size: 13px;
            color: #777;
        }

        footer span {
            color: #A153D2;
            font-weight: 600;
        }

        /* ======== RESPONSIVO ======== */
        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

<a th:href="@{/usuarios/login?logout}" class="logout-btn">
    <i class="bi bi-box-arrow-right"></i> Sair
</a>

<div class="logo-container">
    <img src="/images/logo.png" th:src="@{/images/logo.png}">
</div>

<header class="header">
    <p>Um espaço seguro com recursos e apoio.</p>
    <div class="date" th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy • HH:mm')}"></div>
</header>

<div class="alert-box">
    <div>
        <i class="bi bi-exclamation-triangle-fill"></i>
        <strong>Em perigo?</strong> Ligue 180.
    </div>
    <button onclick="window.location.href='tel:180'">
        <i class="bi bi-telephone-fill"></i> Emergência
    </button>
</div>

<section class="cards-container">
    <a th:href="@{/suporte/psicologico}" class="card red">
        <i class="bi bi-heart-pulse-fill red"></i>
        <h3>Ajuda Psicológica</h3>
        <p>Apoio emocional especializado.</p>
    </a>

    <a th:href="@{/denunciar}" class="card purple">
        <i class="bi bi-journal-text purple"></i>
        <h3>Denunciar Caso</h3>
        <p>Registre o incidente.</p>
    </a>

    <a th:href="@{/rede-apoio}" class="card blue">
        <i class="bi bi-geo-alt-fill blue"></i>
        <h3>Rede de Apoio</h3>
        <p>Centros e ONGs próximas.</p>
    </a>

    <a th:href="@{/recursos}" class="card green">
        <i class="bi bi-book-fill green"></i>
        <h3>Recursos</h3>
        <p>Leis e orientações.</p>
    </a>
</section>

<footer>
    🌸 <span>Lembre-se:</span> você merece viver em paz.
</footer>

</body>
</html>
